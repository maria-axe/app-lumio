<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 128 128" width="128" height="128" role="img" aria-label="Lumi, vaga-lume adulto do Lumio">
  <defs>
    <radialGradient id="glowAdult" cx="50%" cy="50%" r="50%">
      <stop offset="0" stop-color="#FFF8C4"/>
      <stop offset="0.55" stop-color="#FFD34D"/>
      <stop offset="1" stop-color="#FFD34D" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="bodyAdult" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#7FC4EA"/>
      <stop offset="1" stop-color="#337FB2"/>
    </linearGradient>
    <linearGradient id="wingAdult" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#FFFFFF" stop-opacity="0.9"/>
      <stop offset="1" stop-color="#D7F1FC" stop-opacity="0.55"/>
    </linearGradient>
  </defs>
  <style>
    @keyframes msc-wing-left { 0%, 100% { transform: rotate(-22deg) translateY(0); } 50% { transform: rotate(-13deg) translateY(-2px); } }
    @keyframes msc-wing-right { 0%, 100% { transform: rotate(22deg) translateY(0); } 50% { transform: rotate(13deg) translateY(-2px); } }
    @keyframes msc-glow { 0%, 100% { opacity: 0.72; transform: scale(0.97); } 50% { opacity: 1; transform: scale(1.04); } }
    @keyframes msc-blink { 0%, 92%, 100% { transform: scaleY(1); } 95% { transform: scaleY(0.12); } 97% { transform: scaleY(1); } }
    @keyframes msc-book-tilt { 0%, 100% { transform: rotate(0deg); } 50% { transform: rotate(-3deg); } }
    .msc-wing-left { transform-box: fill-box; transform-origin: 90% 100%; animation: msc-wing-left 2s ease-in-out infinite; }
    .msc-wing-right { transform-box: fill-box; transform-origin: 10% 100%; animation: msc-wing-right 2s ease-in-out infinite; }
    .msc-glow { transform-box: fill-box; transform-origin: 50% 50%; animation: msc-glow 2.4s ease-in-out infinite; }
    .msc-eyes { transform-box: fill-box; transform-origin: 50% 50%; animation: msc-blink 5.2s infinite; }
    .msc-book { transform-box: fill-box; transform-origin: 50% 100%; animation: msc-book-tilt 2.4s ease-in-out infinite; }
    @media (prefers-reduced-motion: reduce) {
      .msc-wing-left, .msc-wing-right, .msc-glow, .msc-eyes, .msc-book { animation: none; }
    }
  </style>

  <circle class="msc-glow" cx="64" cy="82" r="42" fill="url(#glowAdult)" opacity="0.7"/>

  <ellipse class="msc-wing-left" cx="30" cy="55" rx="25" ry="13" fill="url(#wingAdult)" stroke="#BFE8FA" stroke-width="2"/>
  <ellipse class="msc-wing-right" cx="98" cy="55" rx="25" ry="13" fill="url(#wingAdult)" stroke="#BFE8FA" stroke-width="2"/>

  <path d="M50 36 C46 25 41 20 36 18 M78 36 C82 25 87 20 92 18" stroke="#255F85" stroke-width="2.4" fill="none" stroke-linecap="round"/>
  <circle cx="36" cy="18" r="3.8" fill="#FFD34D"/>
  <circle cx="92" cy="18" r="3.8" fill="#FFD34D"/>

  <ellipse cx="64" cy="68" rx="33" ry="40" fill="url(#bodyAdult)" stroke="#255F85" stroke-width="2.6"/>
  <ellipse class="msc-glow" cx="64" cy="97" rx="14" ry="9" fill="#FFD34D"/>
  <ellipse cx="64" cy="97" rx="8" ry="5" fill="#FFF6C2" opacity="0.9"/>

  <g class="msc-eyes">
    <circle cx="51" cy="58" r="11.5" fill="#FFFFFF"/>
    <circle cx="77" cy="58" r="11.5" fill="#FFFFFF"/>
    <circle cx="53" cy="59" r="5" fill="#1B2A33"/>
    <circle cx="79" cy="59" r="5" fill="#1B2A33"/>
    <circle cx="55" cy="56.5" r="1.7" fill="#FFFFFF"/>
    <circle cx="81" cy="56.5" r="1.7" fill="#FFFFFF"/>
  </g>

  <g fill="none" stroke="#1B2A33" stroke-width="2.6">
    <circle cx="51" cy="58" r="13.5"/>
    <circle cx="77" cy="58" r="13.5"/>
    <path d="M63.5 57 Q64 53 64.5 57" stroke-linecap="round"/>
    <path d="M37.5 57 L29.5 53 M90.5 57 L98.5 53" stroke-linecap="round"/>
  </g>

  <path d="M42 35 C48 32 54 32 59 35 M71 35 C76 32 82 32 87 35" stroke="#255F85" stroke-width="2.2" fill="none" stroke-linecap="round"/>
  <path d="M54 80 C59 86 70 86 75 80" stroke="#255F85" stroke-width="2.4" fill="none" stroke-linecap="round"/>
  <path d="M61 82 l2 3 l2 -3 Z M69 82 l2 3 l2 -3 Z" fill="#FFFFFF"/>

  <g class="msc-book">
    <rect x="40" y="98" width="48" height="20" rx="3" fill="#6EDB0B" stroke="#4BA800" stroke-width="2"/>
    <path d="M64 98 V118" stroke="#4BA800" stroke-width="2"/>
    <path d="M46 104 h12 M46 109 h9 M70 104 h12 M70 109 h9" stroke="#FFFFFF" stroke-width="2" stroke-linecap="round"/>
  </g>
</svg>
