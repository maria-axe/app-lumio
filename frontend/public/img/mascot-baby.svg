<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 128 128" width="128" height="128" role="img" aria-label="Lumi, vaga-lume bebê do Lumio">
  <defs>
    <radialGradient id="glowBaby" cx="50%" cy="50%" r="50%">
      <stop offset="0" stop-color="#FFF8C4"/>
      <stop offset="0.55" stop-color="#FFD34D"/>
      <stop offset="1" stop-color="#FFD34D" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="bodyBaby" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#8FD4F2"/>
      <stop offset="1" stop-color="#3E93C7"/>
    </linearGradient>
    <linearGradient id="wingBaby" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#FFFFFF" stop-opacity="0.95"/>
      <stop offset="1" stop-color="#D7F1FC" stop-opacity="0.65"/>
    </linearGradient>
  </defs>
  <style>
    @keyframes msc-wing-left { 0%, 100% { transform: rotate(-26deg) translateY(0); } 50% { transform: rotate(-16deg) translateY(-2px); } }
    @keyframes msc-wing-right { 0%, 100% { transform: rotate(26deg) translateY(0); } 50% { transform: rotate(16deg) translateY(-2px); } }
    @keyframes msc-glow { 0%, 100% { opacity: 0.65; transform: scale(0.97); } 50% { opacity: 1; transform: scale(1.04); } }
    @keyframes msc-blink { 0%, 92%, 100% { transform: scaleY(1); } 95% { transform: scaleY(0.12); } 97% { transform: scaleY(1); } }
    @keyframes msc-bob { 0%, 100% { transform: translateY(0); } 50% { transform: translateY(-2px); } }
    .msc-wing-left { transform-box: fill-box; transform-origin: 90% 100%; animation: msc-wing-left 1.8s ease-in-out infinite; }
    .msc-wing-right { transform-box: fill-box; transform-origin: 10% 100%; animation: msc-wing-right 1.8s ease-in-out infinite; }
    .msc-glow { transform-box: fill-box; transform-origin: 50% 50%; animation: msc-glow 2.1s ease-in-out infinite; }
    .msc-eyes { transform-box: fill-box; transform-origin: 50% 50%; animation: msc-blink 4.8s infinite; }
    .msc-body { animation: msc-bob 2.6s ease-in-out infinite; }
    @media (prefers-reduced-motion: reduce) {
      .msc-wing-left, .msc-wing-right, .msc-glow, .msc-eyes, .msc-body { animation: none; }
    }
  </style>

  <circle class="msc-glow" cx="64" cy="82" r="40" fill="url(#glowBaby)" opacity="0.7"/>

  <ellipse class="msc-wing-left" cx="34" cy="54" rx="23" ry="13" fill="url(#wingBaby)" stroke="#BFE8FA" stroke-width="2"/>
  <ellipse class="msc-wing-right" cx="94" cy="54" rx="23" ry="13" fill="url(#wingBaby)" stroke="#BFE8FA" stroke-width="2"/>

  <path d="M51 36 C47 26 42 21 37 19 M77 36 C81 26 86 21 91 19" stroke="#2F6E94" stroke-width="2.4" fill="none" stroke-linecap="round"/>
  <circle cx="37" cy="19" r="4" fill="#FFD34D"/>
  <circle cx="91" cy="19" r="4" fill="#FFD34D"/>

  <g class="msc-body">
    <ellipse cx="64" cy="68" rx="32" ry="39" fill="url(#bodyBaby)" stroke="#2F6E94" stroke-width="2.6"/>

    <ellipse cx="43" cy="74" rx="6" ry="4.5" fill="#FF9AA2" opacity="0.7"/>
    <ellipse cx="85" cy="74" rx="6" ry="4.5" fill="#FF9AA2" opacity="0.6"/>

    <g class="msc-eyes">
      <circle cx="52" cy="59" r="15" fill="#FFFFFF"/>
      <circle cx="76" cy="59" r="15" fill="#FFFFFF"/>
      <circle cx="54" cy="60" r="7" fill="#1B2A33"/>
      <circle cx="78" cy="60" r="7" fill="#1B2A33"/>
      <circle cx="56.5" cy="57" r="2.4" fill="#FFFFFF"/>
      <circle cx="80.5" cy="57" r="2.4" fill="#FFFFFF"/>
    </g>

    <path d="M55 83 C60 89 68 89 73 83" stroke="#2F6E94" stroke-width="2.6" fill="none" stroke-linecap="round"/>
  </g>

  <path d="M18 28 l2.4 6 6 2.4 -6 2.4 -2.4 6 -2.4 -6 -6 -2.4 6 -2.4 Z" fill="#FFD34D" opacity="0.9"/>
  <path d="M108 34 l1.8 4.5 4.5 1.8 -4.5 1.8 -1.8 4.5 -1.8 -4.5 -4.5 -1.8 4.5 -1.8 Z" fill="#FFE58A" opacity="0.85"/>
</svg>
