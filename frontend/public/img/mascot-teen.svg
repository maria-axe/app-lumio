<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 128 128" width="128" height="128" role="img" aria-label="Lumi, vaga-lume adolescente do Lumio">
  <defs>
    <radialGradient id="glowTeen" cx="50%" cy="50%" r="50%">
      <stop offset="0" stop-color="#FFF8C4"/>
      <stop offset="0.55" stop-color="#FFD34D"/>
      <stop offset="1" stop-color="#FFD34D" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="bodyTeen" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#6FB7E0"/>
      <stop offset="1" stop-color="#3E93C7"/>
    </linearGradient>
    <linearGradient id="wingTeen" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#FFFFFF" stop-opacity="0.92"/>
      <stop offset="1" stop-color="#D7F1FC" stop-opacity="0.6"/>
    </linearGradient>
  </defs>
  <style>
    @keyframes msc-wing-left { 0%, 100% { transform: rotate(-24deg) translateY(0); } 50% { transform: rotate(-12deg) translateY(-3px); } }
    @keyframes msc-wing-right { 0%, 100% { transform: rotate(24deg) translateY(0); } 50% { transform: rotate(12deg) translateY(-3px); } }
    @keyframes msc-glow { 0%, 100% { opacity: 0.7; transform: scale(0.97); } 50% { opacity: 1; transform: scale(1.05); } }
    @keyframes msc-blink { 0%, 92%, 100% { transform: scaleY(1); } 95% { transform: scaleY(0.12); } 97% { transform: scaleY(1); } }
    @keyframes msc-headphones { 0%, 100% { transform: translateY(0) rotate(0deg); } 50% { transform: translateY(-1px) rotate(2deg); } }
    .msc-wing-left { transform-box: fill-box; transform-origin: 90% 100%; animation: msc-wing-left 1.7s ease-in-out infinite; }
    .msc-wing-right { transform-box: fill-box; transform-origin: 10% 100%; animation: msc-wing-right 1.7s ease-in-out infinite; }
    .msc-glow { transform-box: fill-box; transform-origin: 50% 50%; animation: msc-glow 2s ease-in-out infinite; }
    .msc-eyes { transform-box: fill-box; transform-origin: 50% 50%; animation: msc-blink 4.8s infinite; }
    .msc-headphones { transform-box: fill-box; transform-origin: 50% 70%; animation: msc-headphones 2.1s ease-in-out infinite; }
    @media (prefers-reduced-motion: reduce) {
      .msc-wing-left, .msc-wing-right, .msc-glow, .msc-eyes, .msc-headphones { animation: none; }
    }
  </style>

  <circle class="msc-glow" cx="64" cy="82" r="39" fill="url(#glowTeen)" opacity="0.68"/>

  <ellipse class="msc-wing-left" cx="32" cy="54" rx="24" ry="12" fill="url(#wingTeen)" stroke="#BFE8FA" stroke-width="2"/>
  <ellipse class="msc-wing-right" cx="96" cy="54" rx="24" ry="12" fill="url(#wingTeen)" stroke="#BFE8FA" stroke-width="2"/>

  <path d="M50 36 C46 25 41 20 36 18 M78 36 C82 25 87 20 92 18" stroke="#255F85" stroke-width="2.4" fill="none" stroke-linecap="round"/>
  <circle cx="36" cy="18" r="3.6" fill="#FFD34D"/>
  <circle cx="92" cy="18" r="3.6" fill="#FFD34D"/>

  <ellipse cx="64" cy="68" rx="31" ry="39" fill="url(#bodyTeen)" stroke="#255F85" stroke-width="2.6"/>
  <ellipse class="msc-glow" cx="64" cy="96" rx="13" ry="8" fill="#FFD34D"/>
  <ellipse cx="64" cy="96" rx="8" ry="4.5" fill="#FFF6C2" opacity="0.9"/>

  <g class="msc-headphones">
    <path d="M44 59 C44 36 57 24 74 24 C91 24 104 36 104 59" fill="none" stroke="#CE82FF" stroke-width="5" stroke-linecap="round"/>
    <rect x="37" y="53" width="12" height="20" rx="5" fill="#CE82FF"/>
    <rect x="99" y="53" width="12" height="20" rx="5" fill="#CE82FF"/>
    <rect x="40" y="56" width="6" height="14" rx="3" fill="#F3E6FF"/>
    <rect x="102" y="56" width="6" height="14" rx="3" fill="#F3E6FF"/>
  </g>

  <g class="msc-eyes">
    <circle cx="52" cy="59" r="12" fill="#FFFFFF"/>
    <circle cx="78" cy="59" r="12" fill="#FFFFFF"/>
    <circle cx="54" cy="60" r="5.6" fill="#1B2A33"/>
    <circle cx="80" cy="60" r="5.6" fill="#1B2A33"/>
    <circle cx="56" cy="57.5" r="1.8" fill="#FFFFFF"/>
    <circle cx="82" cy="57.5" r="1.8" fill="#FFFFFF"/>
  </g>

  <path d="M52 36 C57 33 62 33 66 36 M74 36 C79 33 84 33 88 36" stroke="#255F85" stroke-width="2.2" fill="none" stroke-linecap="round"/>
  <path d="M54 82 C59 87 69 87 74 82" stroke="#255F85" stroke-width="2.4" fill="none" stroke-linecap="round"/>

  <path d="M43 96 h42 a3 3 0 0 1 3 3 v13 a3 3 0 0 1 -3 3 h-42 a3 3 0 0 1 -3 -3 v-13 a3 3 0 0 1 3 -3 Z" fill="#6EDB0B" stroke="#4BA800" stroke-width="2"/>
  <path d="M64 96 V115" stroke="#4BA800" stroke-width="2"/>
  <path d="M48 102 h11 M48 107 h8 M70 102 h11 M70 107 h8" stroke="#FFFFFF" stroke-width="2" stroke-linecap="round"/>
</svg>
